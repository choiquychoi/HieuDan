<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="100%" height="100%" fill="none">
  <!-- Hoa Văn Hoa Lá Cúc Dây / Búp Sen Thời Lý (Micro Floral Accent) -->
  <defs>
    <linearGradient id="micro-floral-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8C6B3E" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <g id="micro-floral-group" transform="translate(120, 35)">
    <!-- 1. ĐÓA HOA SEN / CÚC DÂY TRUNG TÂM (Đối xứng tâm 0,0) -->
    <!-- Cánh đứng hướng lên -->
    <path
      d="M0,0 C-5,-10 -6,-20 0,-26 C6,-20 5,-10 0,0 Z"
      fill="url(#micro-floral-fill)"
      stroke="#8C6B3E"
      stroke-width="1.2"
    />
    <!-- Cánh đứng hướng xuống -->
    <path
      d="M0,0 C-5,10 -6,20 0,26 C6,20 5,10 0,0 Z"
      fill="url(#micro-floral-fill)"
      stroke="#8C6B3E"
      stroke-width="1.2"
    />
    <!-- Cánh ngang trái -->
    <path
      d="M0,0 C-10,-5 -20,-6 -26,0 C-20,6 -10,5 0,0 Z"
      fill="url(#micro-floral-fill)"
      stroke="#8C6B3E"
      stroke-width="1.2"
    />
    <!-- Cánh ngang phải -->
    <path
      d="M0,0 C10,-5 20,-6 26,0 C20,6 10,5 0,0 Z"
      fill="url(#micro-floral-fill)"
      stroke="#8C6B3E"
      stroke-width="1.2"
    />
    <!-- 4 Cánh xiên nhỏ -->
    <circle cx="-10" cy="-10" r="3.5" fill="#8C6B3E" fill-opacity="0.3" stroke="#554134" stroke-width="0.8" />
    <circle cx="10" cy="-10" r="3.5" fill="#8C6B3E" fill-opacity="0.3" stroke="#554134" stroke-width="0.8" />
    <circle cx="-10" cy="10" r="3.5" fill="#8C6B3E" fill-opacity="0.3" stroke="#554134" stroke-width="0.8" />
    <circle cx="10" cy="10" r="3.5" fill="#8C6B3E" fill-opacity="0.3" stroke="#554134" stroke-width="0.8" />

    <!-- Tâm hạt sen đỏ sơn mài -->
    <circle cx="0" cy="0" r="4.5" fill="#9E3324" fill-opacity="0.85" stroke="#554134" stroke-width="1.0" />

    <!-- 2. NHÁNH HOA LÁ UỐN LƯỢN SANG PHẢI (Right branch) -->
    <path
      d="M26,0 
         C45,-2 60,-15 80,-10 
         C95,-6 105,8 98,16 
         C92,22 80,18 82,10 
         C84,4 92,2 96,6"
      stroke="#8C6B3E"
      stroke-width="1.4"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Búp lá phụ bên phải -->
    <path
      d="M50,-6 C60,-18 72,-16 68,-6 Z"
      fill="url(#micro-floral-fill)"
      stroke="#554134"
      stroke-width="1.0"
    />
    <path
      d="M65,0 C74,10 82,8 78,0 Z"
      fill="url(#micro-floral-fill)"
      stroke="#554134"
      stroke-width="1.0"
    />
    <!-- Chấm tròn hạt sương -->
    <circle cx="106" cy="4" r="1.8" fill="#8C6B3E" />

    <!-- 3. NHÁNH HOA LÁ UỐN LƯỢN SANG TRÁI (Left branch - Đối xứng) -->
    <path
      d="M-26,0 
         C-45,-2 -60,-15 -80,-10 
         C-95,-6 -105,8 -98,16 
         C-92,22 -80,18 -82,10 
         C-84,4 -92,2 -96,6"
      stroke="#8C6B3E"
      stroke-width="1.4"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Búp lá phụ bên trái -->
    <path
      d="M-50,-6 C-60,-18 -72,-16 -68,-6 Z"
      fill="url(#micro-floral-fill)"
      stroke="#554134"
      stroke-width="1.0"
    />
    <path
      d="M-65,0 C-74,10 -82,8 -78,0 Z"
      fill="url(#micro-floral-fill)"
      stroke="#554134"
      stroke-width="1.0"
    />
    <!-- Chấm tròn hạt sương -->
    <circle cx="-106" cy="4" r="1.8" fill="#8C6B3E" />
  </g>
</svg>
