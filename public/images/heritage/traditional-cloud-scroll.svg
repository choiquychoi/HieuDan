<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="100%" fill="none">
  <!-- Vân Mây Cuộn Đuôi Nheo Truyền Thống Việt Nam (Thời Hậu Lê - Nguyễn) -->
  <defs>
    <linearGradient id="cloud-fill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#8C6B3E" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#554134" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <g id="traditional-cloud-group" transform="translate(10, 10)">
    <!-- 1. MẢNG THÂN MÂY CHÍNH (Fill + Stroke) -->
    <path
      d="M30,110 
         C10,95 5,65 25,45 
         C45,25 80,30 95,50 
         C105,30 135,15 165,25 
         C195,35 205,65 195,85 
         C225,70 260,75 285,95 
         C315,120 310,145 280,150 
         C320,140 370,115 400,70 
         C370,95 325,125 270,130 
         C235,135 210,120 195,105 
         C180,125 150,135 125,130 
         C95,125 80,105 75,95 
         C60,115 35,125 30,110 Z"
      fill="url(#cloud-fill-grad)"
      stroke="#8C6B3E"
      stroke-width="1.6"
      stroke-linejoin="round"
    />

    <!-- 2. XOẮN ỐC MÂY TRUYỀN THỐNG 1 (Cụm mây đầu tròn bên trái) -->
    <path
      d="M48,55 
         C35,68 38,90 52,98 
         C68,105 88,95 90,78 
         C92,62 78,50 64,54 
         C55,58 52,70 60,76 
         C66,80 74,76 72,70"
      stroke="#554134"
      stroke-width="1.4"
      stroke-linecap="round"
      fill="none"
    />

    <!-- 3. XOẮN ỐC MÂY TRUYỀN THỐNG 2 (Cụm mây đỉnh giữa) -->
    <path
      d="M130,45 
         C120,58 122,80 138,88 
         C154,95 174,85 176,68 
         C178,52 165,40 150,44 
         C140,48 138,60 146,66 
         C152,70 160,66 158,60"
      stroke="#554134"
      stroke-width="1.4"
      stroke-linecap="round"
      fill="none"
    />

    <!-- 4. ĐƯỜNG GỜ NỔI VIỀN MÂY NỘI TẠI (INNER CONTOURS) -->
    <path
      d="M80,65 C100,55 125,60 140,75 C155,90 180,95 200,85"
      stroke="#8C6B3E"
      stroke-width="1.0"
      stroke-opacity="0.6"
      fill="none"
    />
    <path
      d="M205,95 C230,85 260,95 275,115"
      stroke="#8C6B3E"
      stroke-width="1.0"
      stroke-opacity="0.6"
      fill="none"
    />

    <!-- 5. ĐUÔI NHEO MÂY VÚT DÀI (TRAILING STREAMER) -->
    <!-- Dải đuôi phụ lượn mềm bên dưới -->
    <path
      d="M260,135 C300,130 350,110 385,75"
      stroke="#8C6B3E"
      stroke-width="1.2"
      stroke-dasharray="4 3"
      stroke-opacity="0.65"
      fill="none"
    />
    <path
      d="M230,128 C265,138 310,135 350,115"
      stroke="#554134"
      stroke-width="0.8"
      stroke-opacity="0.5"
      fill="none"
    />

    <!-- Điểm nhấn hạt ngọc sơn mài đỏ ở tâm xoắn mây -->
    <circle cx="66" cy="72" r="2.2" fill="#9E3324" fill-opacity="0.8" />
    <circle cx="152" cy="62" r="2.2" fill="#9E3324" fill-opacity="0.8" />
  </g>
</svg>
