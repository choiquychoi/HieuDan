<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="100%" height="100%" fill="none">
  <!-- Băng Hoa Văn Kỷ Hà Trống Đồng Đông Sơn (Large Heritage Band) -->
  <defs>
    <!-- Pattern 1 Đốt Băng Đông Sơn Hoàn Chỉnh (Rộng 60px, Cao 96px) -->
    <pattern id="dong-son-grand-unit" width="60" height="96" patternUnits="userSpaceOnUse">
      <!-- 1. BĂNG RĂNG CƯA TAM GIÁC TRÊN (Sawtooth band top, y: 6 -> 26) -->
      <polygon points="0,8 30,24 60,8" fill="#8C6B3E" fill-opacity="0.22" stroke="#554134" stroke-width="1.2" stroke-linejoin="round" />
      <line x1="30" y1="8" x2="30" y2="24" stroke="#8C6B3E" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="30" cy="27" r="1.6" fill="#554134" />

      <!-- 2. ĐƯỜNG PHÂN CÁCH TRUNG TÂM -->
      <line x1="0" y1="32" x2="60" y2="32" stroke="#8C6B3E" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.5" />

      <!-- 3. LÕI CHÍNH: VÒNG TRÒN ĐỒNG TÂM KÉP & TIẾP TUYẾN CHÉO ĐÔNG SƠN (y: 32 -> 64) -->
      <!-- Tiếp tuyến chéo liên hoàn nối giữa các tâm vòng tròn -->
      <line x1="0" y1="38" x2="60" y2="58" stroke="#8C6B3E" stroke-width="1.2" stroke-opacity="0.75" />
      <line x1="0" y1="58" x2="60" y2="38" stroke="#8C6B3E" stroke-width="1.2" stroke-opacity="0.75" />

      <!-- Vòng tròn ngoài (r=14) -->
      <circle cx="30" cy="48" r="14" stroke="#554134" stroke-width="1.6" fill="#F7F3EB" />
      <!-- Vòng tròn giữa (r=9) -->
      <circle cx="30" cy="48" r="9" stroke="#8C6B3E" stroke-width="1.0" fill="#EDE2D1" fill-opacity="0.5" />
      <!-- Vòng tròn trong (r=5) -->
      <circle cx="30" cy="48" r="5" stroke="#554134" stroke-width="0.8" fill="none" />
      <!-- Chấm tâm sơn mài đỏ Đông Sơn -->
      <circle cx="30" cy="48" r="2.6" fill="#9E3324" fill-opacity="0.9" />

      <!-- Hạt ngọc phụ ở giao điểm tiếp tuyến (giữa 2 đốt) -->
      <circle cx="0" cy="48" r="1.8" fill="#8C6B3E" />
      <circle cx="60" cy="48" r="1.8" fill="#8C6B3E" />

      <!-- 4. ĐƯỜNG PHÂN CÁCH DƯỚI -->
      <line x1="0" y1="64" x2="60" y2="64" stroke="#8C6B3E" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.5" />

      <!-- 5. BĂNG RĂNG CƯA TAM GIÁC DƯỚI ĐỐI XỨNG (y: 70 -> 90) -->
      <polygon points="0,88 30,72 60,88" fill="#8C6B3E" fill-opacity="0.22" stroke="#554134" stroke-width="1.2" stroke-linejoin="round" />
      <line x1="30" y1="88" x2="30" y2="72" stroke="#8C6B3E" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="30" cy="69" r="1.6" fill="#554134" />
    </pattern>

    <!-- Mặt nạ mờ dần 2 đầu (Luminance white = visible, black = invisible) -->
    <linearGradient id="grand-band-fade-mask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="10%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="90%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <mask id="grand-band-mask">
      <rect x="0" y="0" width="1200" height="96" fill="url(#grand-band-fade-mask)" />
    </mask>
  </defs>

  <g mask="url(#grand-band-mask)">
    <!-- Đường chỉ viền đôi mép trên -->
    <line x1="0" y1="3" x2="1200" y2="3" stroke="#554134" stroke-width="1.8" stroke-opacity="0.7" />
    <line x1="0" y1="6" x2="1200" y2="6" stroke="#8C6B3E" stroke-width="0.8" stroke-opacity="0.5" />

    <!-- Thân băng hoa văn Trống Đồng -->
    <rect x="0" y="0" width="1200" height="96" fill="url(#dong-son-grand-unit)" />

    <!-- Đường chỉ viền đôi mép dưới -->
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#8C6B3E" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="0" y1="93" x2="1200" y2="93" stroke="#554134" stroke-width="1.8" stroke-opacity="0.7" />
  </g>
</svg>
